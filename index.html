<script>
const fileInput = document.getElementById("htmlFile");
const htmlCode = document.getElementById("htmlCode");
const projectName = document.getElementById("projectName");
const fileName = document.getElementById("fileName");
const clearFileButton = document.getElementById("clearFile");

fileInput.addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;

  fileName.textContent = file.name;
  clearFileButton.style.display = "block";

  if(!projectName.value.trim()){
    projectName.value = file.name
      .replace(/\.(html?|HTML?)$/, "")
      .toLowerCase()
      .replace(/[^a-z0-9-]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 50);
  }

  const reader = new FileReader();

  reader.onload = function(event){
    htmlCode.value = event.target.result;
  };

  reader.onerror = function(){
    fileName.textContent = "";
    clearFileButton.style.display = "none";

    const status = document.getElementById("status");
    status.className = "info error";
    status.textContent = "Gagal membaca file HTML.";
  };

  reader.readAsText(file);
});

function clearFile(){
  fileInput.value = "";
  fileName.textContent = "";
  clearFileButton.style.display = "none";
  htmlCode.value = "";
}

function openHelp(){
  window.open(
    "https://wa.me/6285790618370",
    "_blank"
  );
}

async function deploy(){
  const name = projectName.value.trim();
  const html = htmlCode.value;

  const status = document.getElementById("status");
  const button = document.getElementById("deployButton");

  if(!name){
    status.className = "info error";
    status.textContent = "Masukkan nama project dulu.";
    projectName.focus();
    return;
  }

  if(!html.trim()){
    status.className = "info error";
    status.textContent =
      "Masukkan kode HTML atau upload file dulu.";
    htmlCode.focus();
    return;
  }

  button.disabled = true;
  button.textContent = "MENGUPLOAD...";

  status.className = "info";
  status.innerHTML =
    '<span class="loading">' +
    'Mengupload HTML...' +
    '<span class="loading-dot"></span>' +
    '</span>';

  try{
    const { upload } = await import(
      "https://esm.sh/@vercel/blob@2.6.1/client"
    );

    const file = new File(
      [html],
      name + ".html",
      {
        type: "text/html"
      }
    );

    const blob = await upload(
      name + "-" + Date.now() + ".html",
      file,
      {
        access: "private",
        handleUploadUrl: "/api/upload",
        multipart: true,

        onUploadProgress(event){
          const percent =
            Math.round(event.percentage || 0);

          status.innerHTML =
            '<span class="loading">' +
            "Mengupload HTML " +
            percent +
            "%..." +
            '<span class="loading-dot"></span>' +
            "</span>";
        }
      }
    );

    if(!blob || !blob.pathname){
      throw new Error(
        "Upload HTML ke Blob gagal."
      );
    }

    button.textContent = "MEMBUAT WEBSITE...";

    status.innerHTML =
      '<span class="loading">' +
      "Membuat deployment Vercel..." +
      '<span class="loading-dot"></span>' +
      "</span>";

    const response = await fetch(
      "/api/deploy",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          projectName: name,
          pathname: blob.pathname
        })
      }
    );

    const responseText =
      await response.text();

    let data;

    try{
      data = JSON.parse(responseText);
    }catch{
      data = {
        error: responseText
      };
    }

    if(!response.ok){
      let errorText = "";

      if(typeof data === "string"){
        errorText = data;
      }else if(
        data &&
        typeof data.error === "string"
      ){
        errorText = data.error;
      }else{
        errorText =
          JSON.stringify(data, null, 2);
      }

      throw new Error(
        "HTTP " +
        response.status +
        ": " +
        errorText
      );
    }

    if(!data.url){
      throw new Error(
        "Link website tidak ditemukan."
      );
    }

    const websiteUrl =
      data.url.replace(
        /'/g,
        "&#039;"
      );

    status.className =
      "info success";

    status.innerHTML =
      "Website berhasil dibuat." +
      "<br><br>" +
      "<a href='" +
      websiteUrl +
      "' target='_blank'>" +
      websiteUrl +
      "</a>" +
      "<div class='result-actions'>" +
        "<a class='result-btn open-btn' " +
        "href='" +
        websiteUrl +
        "' target='_blank'>" +
        "BUKA WEBSITE" +
        "</a>" +
        "<button class='result-btn copy-btn' " +
        "onclick=\"copyWebsite('" +
        data.url.replace(
          /'/g,
          "\\'"
        ) +
        "')\">" +
        "SALIN LINK" +
        "</button>" +
      "</div>";

    button.textContent = "BERHASIL";

  }catch(error){
    console.error(error);

    status.className = "info error";

    status.innerHTML =
      "Proses gagal." +
      "<br><br>" +
      "<pre style='white-space:pre-wrap;'>" +
      escapeHtml(
        error.message ||
        "Terjadi kesalahan."
      ) +
      "</pre>";

    button.disabled = false;
    button.textContent =
      "PROSES SEKARANG";
  }
}

async function copyWebsite(url){
  try{
    await navigator.clipboard.writeText(url);

    document
      .querySelectorAll(".copy-btn")
      .forEach(btn => {
        btn.textContent = "TERSALIN";

        setTimeout(() => {
          btn.textContent = "SALIN LINK";
        }, 2000);
      });

  }catch(error){
    alert("Gagal menyalin link.");
  }
}

function escapeHtml(text){
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
      </script>
