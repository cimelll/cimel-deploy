<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cimel Deploy</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:
    radial-gradient(circle at 50% -10%,rgba(22,140,255,.06),transparent 35%),
    #020304;
  color:#eaf6ff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

.wrap{
  width:min(720px,100%);
  margin:auto;
  padding:25px 18px 60px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:20px;
  border-bottom:1px solid rgba(255,255,255,.055);
  margin-bottom:35px;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:#168cff;
}

.badge{
  font-size:10px;
  color:#168cff;
  border:1px solid rgba(22,140,255,.22);
  background:rgba(22,140,255,.025);
  padding:6px 10px;
  border-radius:20px;
}

.label{
  color:#168cff;
  font-size:11px;
  letter-spacing:3px;
  margin-bottom:14px;
}

h1{
  font-size:36px;
  line-height:1.1;
  font-weight:800;
  letter-spacing:-.7px;
  margin-bottom:12px;
}

h1 span{
  color:#168cff;
}

.sub{
  color:#647486;
  font-size:14px;
  line-height:1.7;
  margin-bottom:28px;
}

/* glass panel */

.panel{
  margin-bottom:20px;
  padding:16px;

  background:rgba(7,9,12,.72);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  border:1px solid rgba(255,255,255,.055);
  border-radius:13px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.018);
}

.panel-title{
  color:#8294a8;
  font-size:11px;
  letter-spacing:2px;
  margin-bottom:14px;
}

input,textarea{
  width:100%;
  background:rgba(0,0,0,.48);
  border:1px solid rgba(255,255,255,.07);
  color:#fff;
  padding:13px;
  border-radius:8px;
  outline:none;
  font-family:monospace;

  box-shadow:
    inset 0 1px 8px rgba(0,0,0,.25);
}

input::placeholder,
textarea::placeholder{
  color:#465565;
}

input:focus,
textarea:focus{
  border-color:rgba(22,140,255,.5);
  box-shadow:
    0 0 0 3px rgba(22,140,255,.055),
    inset 0 1px 8px rgba(0,0,0,.3);
}

textarea{
  min-height:230px;
  resize:vertical;
  line-height:1.5;
}

/* file */

.file-box{
  width:100%;
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.045);
  border-radius:9px;
  padding:11px;
}

.file-label{
  display:block;
  width:100%;
  padding:13px;

  border:1px dashed rgba(255,255,255,.1);
  border-radius:8px;

  text-align:center;
  color:#718397;
  cursor:pointer;

  background:rgba(255,255,255,.008);
}

.file-label:hover{
  color:#168cff;
  border-color:rgba(22,140,255,.4);
}

.file-name{
  margin-top:10px;
  color:#718397;
  font-size:12px;
  word-break:break-word;
}

.clear-file{
  display:none;
  margin-top:10px;
  background:none;
  border:0;
  color:#ff5c70;
  cursor:pointer;
  font-size:11px;
}

/* deploy */

.deploy{
  width:100%;
  padding:16px;

  border:1px solid rgba(22,140,255,.35);
  border-radius:9px;

  background:#168cff;

  color:white;
  font-weight:800;
  cursor:pointer;
  font-size:15px;

  box-shadow:0 8px 25px rgba(22,140,255,.1);
}

.deploy:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* status */

.info{
  margin-top:18px;
  color:#718397;
  font-size:12px;
  line-height:1.6;
  word-break:break-word;
}

.success{
  color:#39d98a;
}

.error{
  color:#ff5c70;
}

.loading{
  display:inline-flex;
  align-items:center;
  gap:8px;
}

.loading-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#39d98a;
  box-shadow:0 0 8px rgba(57,217,138,.4);
  animation:pulse 1s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:.25;
    transform:scale(.8);
  }

  50%{
    opacity:1;
    transform:scale(1);
  }
}

/* result */

.result-actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.result-btn{
  flex:1;
  padding:12px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
}

.open-btn{
  background:#168cff;
  color:white;
  border:1px solid #168cff;
}

.copy-btn{
  background:#07090c;
  color:#168cff;
  border:1px solid rgba(22,140,255,.3);
}

.copy-btn:hover{
  background:#0a0f15;
}

/* bantuan */

.help-popup{
  position:fixed;
  right:18px;
  bottom:18px;

  display:flex;
  align-items:center;
  gap:10px;

  padding:8px 13px 8px 8px;

  background:rgba(5,7,10,.9);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.07);
  border-radius:13px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.025);

  cursor:pointer;
  z-index:999;

  transition:.2s;
}

.help-popup:hover{
  border-color:rgba(22,140,255,.3);
  transform:translateY(-2px);
}

.help-icon{
  width:34px;
  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:#0a1017;
  border:1px solid rgba(22,140,255,.18);

  color:#168cff;
  font-size:14px;
}

.help-text{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.help-title{
  color:#eaf6ff;
  font-size:11px;
  font-weight:700;
}

.help-sub{
  color:#526274;
  font-size:9px;
}

.help-mic{
  display:inline-block;
  width:5px;
  height:5px;
  margin-left:4px;
  vertical-align:middle;
  border-radius:50%;
  background:#39d98a;
  box-shadow:0 0 7px rgba(57,217,138,.5);
  animation:helpPulse 1.4s ease-in-out infinite;
}

@keyframes helpPulse{
  0%,100%{
    opacity:.25;
  }

  50%{
    opacity:1;
  }
}

/* footer */

.footer{
  border-top:1px solid rgba(255,255,255,.05);
  margin-top:35px;
  padding-top:18px;
  color:#405266;
  font-size:11px;
  display:flex;
  justify-content:space-between;
}

a{
  color:#168cff;
  word-break:break-all;
}

@media(max-width:450px){

  h1{
    font-size:29px;
  }

  .result-actions{
    flex-direction:column;
  }

  .help-popup{
    right:12px;
    bottom:12px;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">

    <div class="logo">
      Cimel<span>.</span>Deploy
    </div>

    <div class="badge">
      BETA
    </div>

  </div>

  <div class="label">
    UPLOAD & PUBLISH
  </div>

  <h1>
    Ubah <span>HTML</span><br>
    jadi website.
  </h1>

  <p class="sub">
    Masukkan kode HTML kamu, beri nama project,
    lalu deploy menjadi website yang bisa dibuka secara online.
  </p>

  <div class="panel">

    <div class="panel-title">
      01 — NAMA PROJECT
    </div>

    <input
      id="projectName"
      type="text"
      placeholder="contoh: cimelcantik"
      maxlength="50"
    >

  </div>

  <div class="panel">

    <div class="panel-title">
      02 — IMPORT FILE HTML
    </div>

    <div class="file-box">

      <label class="file-label" for="htmlFile">
        Pilih file HTML
      </label>

      <input
        id="htmlFile"
        type="file"
        accept=".html,.htm,text/html"
        hidden
      >

      <div
        id="fileName"
        class="file-name"
      ></div>

      <button
        id="clearFile"
        class="clear-file"
        onclick="clearFile()"
      >
        Hapus file
      </button>

    </div>

  </div>

  <div class="panel">

    <div class="panel-title">
      03 — HTML CODE
    </div>

    <textarea
      id="htmlCode"
      placeholder="Tempel kode HTML kamu di sini..."
    ></textarea>

  </div>

  <button
    id="deployButton"
    class="deploy"
    onclick="deploy()"
  >
    DEPLOY SEKARANG
  </button>

  <div id="status" class="info"></div>

  <div class="footer">
    <span>Cimel Deploy</span>
    <span>v1.1</span>
  </div>

</div>

<!-- bantuan -->

<div
  class="help-popup"
  onclick="openHelp()"
>

  <div class="help-icon">
    ◉
  </div>

  <div class="help-text">

    <div class="help-title">
      butuh bantuan?
      <span class="help-mic"></span>
    </div>

    <div class="help-sub">
      chat admin
    </div>

  </div>

</div>

<script>

const fileInput =
  document.getElementById("htmlFile");

const htmlCode =
  document.getElementById("htmlCode");

const projectName =
  document.getElementById("projectName");

const fileName =
  document.getElementById("fileName");

const clearFileButton =
  document.getElementById("clearFile");

fileInput.addEventListener("change",function(){

  const file=this.files[0];

  if(!file)return;

  fileName.textContent=file.name;

  clearFileButton.style.display="block";

  if(!projectName.value.trim()){

    projectName.value=
      file.name
      .replace(/\.(html?|HTML?)$/,"")
      .toLowerCase()
      .replace(/[^a-z0-9-]+/g,"-")
      .replace(/^-+|-+$/g,"")
      .slice(0,50);

  }

  const reader=new FileReader();

  reader.onload=function(event){

    htmlCode.value=
      event.target.result;

  };

  reader.readAsText(file);

});

function clearFile(){

  fileInput.value="";
  fileName.textContent="";
  clearFileButton.style.display="none";

}

function openHelp(){

  window.open(
    "https://wa.me/6285790618370",
    "_blank"
  );

}

async function deploy(){

  const name=
    projectName.value.trim();

  const html=
    htmlCode.value.trim();

  const status=
    document.getElementById("status");

  const button=
    document.getElementById("deployButton");

  if(!name){

    status.className="info error";
    status.textContent=
      "masukkan nama project dulu.";

    return;
  }

  if(!html){

    status.className="info error";
    status.textContent=
      "masukkan kode html dulu.";

    return;
  }

  button.disabled=true;

  button.textContent=
    "SEDANG DEPLOY...";

  status.className="info";

  status.innerHTML=
    '<span class="loading">'+
    'sedang membuat website...'+
    '<span class="loading-dot"></span>'+
    '</span>';

  try{

    const response=
      await fetch("/api/deploy",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          projectName:name,
          html:html
        })

      });

    const data=
      await response.json();

    if(!response.ok){

      let errorText="";

      if(typeof data==="string"){
        errorText=data;
      }

      else if(typeof data.error==="string"){
        errorText=data.error;
      }

      else if(data.error){
        errorText=
          JSON.stringify(data.error,null,2);
      }

      else{
        errorText=
          JSON.stringify(data,null,2);
      }

      throw new Error(
        "HTTP "+
        response.status+
        ": "+
        errorText
      );
    }

    if(!data.url){

      throw new Error(
        "link website tidak ditemukan."
      );

    }

    const websiteUrl=
      data.url.replace(/'/g,"&#039;");

    status.className=
      "info success";

    status.innerHTML=
      "link website kamu sudah siap<br><br>"+
      '<a href="'+
      websiteUrl+
      '" target="_blank">'+
      websiteUrl+
      "</a>"+

      '<div class="result-actions">'+

      '<a class="result-btn open-btn" '+
      'href="'+
      websiteUrl+
      '" target="_blank">'+
      'BUKA WEBSITE'+
      '</a>'+

      '<button class="result-btn copy-btn" '+
      'onclick="copyWebsite(\''+
      data.url.replace(/'/g,"\\'")+
      '\')">'+
      'SALIN WEBSITE'+
      '</button>'+

      '</div>';

    button.textContent=
      "DEPLOY BERHASIL";

  }

  catch(error){

    status.className=
      "info error";

    status.innerHTML=
      "Deploy gagal:<br><br>"+
      "<pre style='white-space:pre-wrap'>"+
      escapeHtml(error.message)+
      "</pre>";

    button.disabled=false;

    button.textContent=
      "DEPLOY LAGI";

  }

}

async function copyWebsite(url){

  try{

    await navigator.clipboard.writeText(url);

    document
      .querySelectorAll(".copy-btn")
      .forEach(button=>{

        button.textContent="TERSALIN";

        setTimeout(()=>{

          button.textContent=
            "SALIN WEBSITE";

        },1500);

      });

  }

  catch(error){

    alert("gagal menyalin link");

  }

}

function escapeHtml(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
    </html>
