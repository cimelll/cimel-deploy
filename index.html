<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cimel Deploy</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#05070b;
  color:#eaf6ff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

.wrap{
  width:min(720px,100%);
  margin:auto;
  padding:25px 18px 60px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:20px;
  border-bottom:1px solid #102337;
  margin-bottom:35px;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:#168cff;
}

.badge{
  font-size:10px;
  color:#168cff;
  border:1px solid #124b78;
  padding:6px 10px;
  border-radius:20px;
}

.label{
  color:#168cff;
  font-size:11px;
  letter-spacing:3px;
  margin-bottom:14px;
}

h1{
  font-size:36px;
  line-height:1.1;
  margin-bottom:12px;
}

h1 span{
  color:#168cff;
}

.sub{
  color:#718397;
  font-size:14px;
  line-height:1.7;
  margin-bottom:28px;
}

.panel{
  margin-bottom:20px;
}

.panel-title{
  color:#8294a8;
  font-size:11px;
  letter-spacing:2px;
  margin-bottom:14px;
}

input,textarea{
  width:100%;
  background:#03060a;
  border:1px solid #18324b;
  color:#fff;
  padding:13px;
  border-radius:5px;
  outline:none;
  font-family:monospace;
}

input:focus,
textarea:focus{
  border-color:#168cff;
  box-shadow:0 0 0 3px rgba(22,140,255,.1);
}

textarea{
  min-height:230px;
  resize:vertical;
  line-height:1.5;
}

.file-box{
  width:100%;
  background:#03060a;
  border:1px solid #18324b;
  border-radius:5px;
  padding:15px;
}

.file-label{
  display:block;
  width:100%;
  padding:13px;
  border:1px dashed #28516f;
  border-radius:5px;
  text-align:center;
  color:#8294a8;
  cursor:pointer;
}

.file-label:hover{
  border-color:#168cff;
  color:#168cff;
}

.file-name{
  margin-top:10px;
  color:#718397;
  font-size:12px;
  word-break:break-word;
}

.clear-file{
  display:none;
  margin-top:10px;
  background:none;
  border:0;
  color:#ff5c70;
  cursor:pointer;
  font-size:11px;
}

.deploy{
  width:100%;
  padding:16px;
  border:0;
  border-radius:6px;
  background:#168cff;
  color:white;
  font-weight:800;
  cursor:pointer;
  font-size:15px;
}

.deploy:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.info{
  margin-top:18px;
  color:#718397;
  font-size:12px;
  line-height:1.6;
  word-break:break-word;
}

.success{
  color:#39d98a;
}

.error{
  color:#ff5c70;
}

.loading{
  display:inline-flex;
  align-items:center;
  gap:8px;
}

.loading-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#39d98a;
  animation:pulse 1s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:.25;
    transform:scale(.8);
  }

  50%{
    opacity:1;
    transform:scale(1);
  }
}

.result-actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.result-btn{
  flex:1;
  padding:12px;
  border-radius:6px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
}

.open-btn{
  background:#168cff;
  color:white;
  border:1px solid #168cff;
}

.copy-btn{
  background:#03060a;
  color:#168cff;
  border:1px solid #168cff;
}

.copy-btn:hover{
  background:#071321;
}

/* bantuan */

.help-popup{
  position:fixed;
  right:18px;
  bottom:18px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#0a1018;
  border:1px solid #18324b;
  border-radius:12px;
  padding:10px 13px 10px 10px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,.35);
  transition:.2s;
  z-index:999;
}

.help-popup:hover{
  border-color:#168cff;
  transform:translateY(-2px);
}

.help-icon{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#168cff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.help-text{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.help-title{
  color:#fff;
  font-size:12px;
  font-weight:700;
}

.help-sub{
  color:#718397;
  font-size:10px;
}

.help-mic{
  color:#39d98a;
  font-size:13px;
  margin-left:2px;
}

.footer{
  border-top:1px solid #102337;
  margin-top:35px;
  padding-top:18px;
  color:#405266;
  font-size:11px;
  display:flex;
  justify-content:space-between;
}

a{
  color:#168cff;
  word-break:break-all;
}

@media(max-width:450px){

  h1{
    font-size:29px;
  }

  .result-actions{
    flex-direction:column;
  }

  .help-popup{
    right:12px;
    bottom:12px;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="logo">
      Cimel<span>.</span>Deploy
    </div>

    <div class="badge">
      BETA
    </div>
  </div>

  <div class="label">
    UPLOAD & PUBLISH
  </div>

  <h1>
    Ubah <span>HTML</span><br>
    jadi website.
  </h1>

  <p class="sub">
    Masukkan kode HTML kamu, beri nama project,
    lalu deploy menjadi website yang bisa dibuka secara online.
  </p>

  <div class="panel">

    <div class="panel-title">
      01 — NAMA PROJECT
    </div>

    <input
      id="projectName"
      type="text"
      placeholder="contoh: cimelcantik"
      maxlength="50"
    >

  </div>

  <div class="panel">

    <div class="panel-title">
      02 — IMPORT FILE HTML
    </div>

    <div class="file-box">

      <label class="file-label" for="htmlFile">
        Pilih file HTML
      </label>

      <input
        id="htmlFile"
        type="file"
        accept=".html,.htm,text/html"
        hidden
      >

      <div
        id="fileName"
        class="file-name"
      ></div>

      <button
        id="clearFile"
        class="clear-file"
        onclick="clearFile()"
      >
        Hapus file
      </button>

    </div>

  </div>

  <div class="panel">

    <div class="panel-title">
      03 — HTML CODE
    </div>

    <textarea
      id="htmlCode"
      placeholder="Tempel kode HTML kamu di sini..."
    ></textarea>

  </div>

  <button
    id="deployButton"
    class="deploy"
    onclick="deploy()"
  >
    DEPLOY SEKARANG
  </button>

  <div id="status" class="info"></div>

  <div class="footer">
    <span>Cimel Deploy</span>
    <span>v1.1</span>
  </div>

</div>

<!-- popup bantuan -->

<div
  class="help-popup"
  onclick="openHelp()"
>

  <div class="help-icon">
    👤
  </div>

  <div class="help-text">

    <div class="help-title">
      butuh bantuan?
      <span class="help-mic">●</span>
    </div>

    <div class="help-sub">
      chat admin
    </div>

  </div>

</div>

<script>

const fileInput =
  document.getElementById("htmlFile");

const htmlCode =
  document.getElementById("htmlCode");

const projectName =
  document.getElementById("projectName");

const fileName =
  document.getElementById("fileName");

const clearFileButton =
  document.getElementById("clearFile");

fileInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file){
    return;
  }

  fileName.textContent =
    file.name;

  clearFileButton.style.display =
    "block";

  if(!projectName.value.trim()){

    projectName.value =
      file.name
        .replace(/\.(html?|HTML?)$/,"")
        .toLowerCase()
        .replace(/[^a-z0-9-]+/g,"-")
        .replace(/^-+|-+$/g,"")
        .slice(0,50);

  }

  const reader =
    new FileReader();

  reader.onload = function(event){

    htmlCode.value =
      event.target.result;

  };

  reader.readAsText(file);

});

function clearFile(){

  fileInput.value = "";

  fileName.textContent = "";

  clearFileButton.style.display =
    "none";

}

function openHelp(){

  const nomor =
    "6285790618370";

  const url =
    ["https://wa",".me/",nomor].join("");

  window.open(
    url,
    "_blank"
  );

}

async function deploy(){

  const name =
    projectName.value.trim();

  const html =
    htmlCode.value.trim();

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("deployButton");

  if(!name){

    status.className =
      "info error";

    status.textContent =
      "masukkan nama project dulu.";

    return;
  }

  if(!html){

    status.className =
      "info error";

    status.textContent =
      "masukkan kode html dulu.";

    return;
  }

  button.disabled = true;

  button.textContent =
    "SEDANG DEPLOY...";

  status.className =
    "info";

  status.innerHTML =
    '<span class="loading">' +
    'sedang membuat website...' +
    '<span class="loading-dot"></span>' +
    '</span>';

  try{

    const response =
      await fetch("/api/deploy",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          projectName:name,
          html:html

        })

      });

    const data =
      await response.json();

    if(!response.ok){

      let errorText = "";

      if(typeof data === "string"){
        errorText = data;
      }

      else if(typeof data.error === "string"){
        errorText = data.error;
      }

      else if(data.error){
        errorText =
          JSON.stringify(
            data.error,
            null,
            2
          );
      }

      else{
        errorText =
          JSON.stringify(
            data,
            null,
            2
          );
      }

      throw new Error(
        "HTTP " +
        response.status +
        ": " +
        errorText
      );
    }

    if(!data.url){

      throw new Error(
        "link website tidak ditemukan."
      );
    }

    const websiteUrl =
      data.url.replace(/'/g,"&#039;");

    status.className =
      "info success";

    status.innerHTML =
      "link website kamu sudah siap<br><br>" +
      '<a href="' +
      websiteUrl +
      '" target="_blank">' +
      websiteUrl +
      "</a>" +

      '<div class="result-actions">' +

      '<a class="result-btn open-btn" ' +
      'href="' +
      websiteUrl +
      '" target="_blank">' +
      'BUKA WEBSITE' +
      '</a>' +

      '<button class="result-btn copy-btn" ' +
      'onclick="copyWebsite(\'' +
      data.url.replace(/'/g,"\\'") +
      '\')">' +
      'SALIN WEBSITE' +
      '</button>' +

      '</div>';

    button.textContent =
      "DEPLOY BERHASIL";

  }

  catch(error){

    status.className =
      "info error";

    status.innerHTML =
      "Deploy gagal:<br><br>" +
      "<pre style='white-space:pre-wrap'>" +
      escapeHtml(error.message) +
      "</pre>";

    button.disabled =
      false;

    button.textContent =
      "DEPLOY LAGI";

  }

}

async function copyWebsite(url){

  try{

    await navigator.clipboard.writeText(url);

    const buttons =
      document.querySelectorAll(".copy-btn");

    buttons.forEach(button => {

      button.textContent =
        "TERSALIN";

      setTimeout(() => {

        button.textContent =
          "SALIN WEBSITE";

      },1500);

    });

  }

  catch(error){

    alert(
      "gagal menyalin link"
    );

  }

}

function escapeHtml(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
